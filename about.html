<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .about-content {
            padding-top: 5rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: 15vw;
            position: relative;
            z-index: 10;
        }

        .about-content h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            color: var(--accent-gold);
        }

        .about-content p {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            background: var(--bg-card-glass);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(12px);
        }

        .fade-out-bridge {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            pointer-events: none;
            animation: cinematicReveal 1s ease-out forwards;
        }

        @keyframes cinematicReveal {
            0% {
                opacity: 1;
                visibility: visible;
            }

            100% {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>

<body>
    <div class="bg-container" style="background-image: url('assets/lookmask.jpeg');">

                of study
            </p>
            <p>
                I am a very passionate about technology and i am a quick learner and i am always looking for new
                challenges to take on.
            </p>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
