<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Franklyn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .contact-content {
            padding-top: 5rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: 15vw;
            position: relative;
            z-index: 10;
        }

        .contact-content h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            color: var(--accent-gold);
        }

        .contact-box {
            background: var(--bg-card-glass);
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(12px);
        }

        .contact-box p {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            color: var(--text-primary);
        }

        .fade-out-bridge {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            pointer-events: none;
            animation: cinematicReveal 1s ease-out forwards;
        }

        @keyframes cinematicReveal {
            0% {
                opacity: 1;
                visibility: visible;
            }

            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        @media (max-width: 1100px) {
            .contact-content {
                margin: 0 auto !important;
                /* Override inline styles */
                padding-left: 2rem !important;
                padding-right: 2rem !important;
                padding-top: 10rem !important;
                align-items: center !important;
                text-align: center;
            }

            .contact-content h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="fade-out-bridge"></div>
    <div class="bg-container">
        <div class="bg-overlay"></div>
    </div>

    <nav id="navbar">
        <div class="nav-content">

                <a href="index.html" style="color: inherit; text-decoration: none;">MBONGENI F NGWENYA <span
                        class="subtitle">/ COMPUTER SCIENCE STUDENT</span></a>
            </div>
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">HOME</a></li>
                <li><a href="about.html" class="nav-link">ABOUT ME</a></li>
                <li><a href="skills.html" class="nav-link">SKILLS</a></li>
                <li><a href="contact.html" class="nav-link active">CONTACT</a></li>
            </ul>
        </div>
    </nav>
    <!-- my contact info -->
    <main>

            style="display: flex; flex-direction: column; gap: 2rem; align-items: flex-end; padding-top: 15rem;">
            <a href="mailto:ngwenyambongeni04@gmail.com" class="nav-link">EMAIL</a>
            <a href="https://github.com/franklynmbongeni" class="nav-link" target="_blank">GITHUB</a>

                target="_blank">LINKEDIN</a>

    <script src="script.js"></script>
</body>
