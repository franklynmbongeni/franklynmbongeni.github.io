<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mfn@portfolio:~</title>
<style>
  :root{
    --bg:#0c0f12; --panel:#0f1317; --text:#c9d4cf; --dim:#6b7a74;
    --accent:#5be37a; --accent2:#64b5ff; --amber:#ffcf6b; --red:#ff6b6b; --line:#1b2229;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);
    font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:14px;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:18px}
  .win{width:100%;max-width:860px;height:min(90vh,680px);background:var(--panel);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 24px 70px rgba(0,0,0,.5)}
  .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#11161b;border-bottom:1px solid var(--line)}
  .dot{width:12px;height:12px;border-radius:50%}
  .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .bar .t{margin-left:8px;color:var(--dim);font-size:12px}
  .screen{flex:1;padding:16px 18px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#263039 transparent}
  .screen::-webkit-scrollbar{width:8px}.screen::-webkit-scrollbar-thumb{background:#263039;border-radius:4px}
  .ln{white-space:pre-wrap;word-break:break-word}
  .accent{color:var(--accent)}.accent2{color:var(--accent2)}.amber{color:var(--amber)}.dim{color:var(--dim)}.red{color:var(--red)}
  .prompt .u{color:var(--accent)}.prompt .p{color:var(--accent2)}
  a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}
  .row{display:flex;gap:8px}
  #cmd{background:transparent;border:none;outline:none;color:var(--text);font:inherit;flex:1;caret-color:var(--accent)}
  .tbl{display:grid;grid-template-columns:auto 1fr;gap:1px 20px}
  .tbl .k{color:var(--accent2)}
  .cols{display:flex;gap:26px;flex-wrap:wrap}
  .cols .d{color:var(--accent2)}.cols .f{color:var(--text)}
</style>
</head>
<body>
  <div class="win">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="t" id="bartitle">mfn@portfolio: ~ — zsh</span>
    </div>
    <div class="screen" id="screen">
      <div id="out"></div>
      <div class="row prompt" id="inputline" style="display:none">
        <span id="ps1"><span class="u">mfn@portfolio</span><span class="dim">:</span><span class="p">~</span><span class="dim">$</span></span>
        <input id="cmd" autocomplete="off" spellcheck="false" autofocus />
      </div>
    </div>
  </div>

<script>
const out=document.getElementById('out'), screen=document.getElementById('screen'),
      inputline=document.getElementById('inputline'), input=document.getElementById('cmd'),
      ps1=document.getElementById('ps1'), bartitle=document.getElementById('bartitle');

function line(html='',cls=''){const d=document.createElement('div');d.className='ln '+cls;d.innerHTML=html;out.appendChild(d);screen.scrollTop=screen.scrollHeight;return d;}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------- virtual filesystem ---------- */
const FS={
  'about.txt':
`Mbongeni Franklyn Ngwenya
Computer Science student (Cybersecurity specialization) — Vistula University, Warsaw.

I like building things that are correct, fast and secure — from the socket layer up.
Most of what I learn comes from shipping real projects, then stress-testing them.
Fluent English, based in Warsaw, basic (A1) Polish.
Authorized to work in Poland (no sponsorship required).`,

  'projects.md':
`# Projects

[1] LAN File Transfer System (Python)
    Multithreaded HTTP server, 64KB chunked streaming, QR-code bootstrap URL,
    secure file-access layer (path normalization + root confinement), Tkinter GUI.

[2] Chess Engine & GUI (Python, pygame)
    Engine from scratch (no libraries) — OOP per-piece move generation,
    check detection via legal-move search, king-safety & checkmate, pytest suite.

[3] Monitoring & Log Analysis (Python, Bash)
    psutil monitor (per-core CPU, memory, disk, network I/O);
    Bash/awk nginx analyzer: top IPs, paths, status codes, user agents.

→ more at github.com/franklynmbongeni`,

  'skills.txt':
`languages    Python, C++, Bash, JavaScript
engineering  DS & algorithms, OOP, unit testing (pytest), input validation
web & data   HTTP, REST, HTML/CSS · MySQL, SQL
systems      Linux, Windows, TCP/IP, sockets, log analysis
security     Secure coding, OWASP Top 10, detection (Elastic)
tools        Git, GitHub, PyQt5, Tkinter, pygame`,

  'security.md':
`# Security

▸ Goldman Sachs Cybersecurity Hackathon — offensive & defensive challenges (Immersive Labs), 2026
▸ Secure code review & remediation — SQLi, SSTI, command injection, XXE, file upload (Python/Flask)
▸ AI/LLM security — prompt-injection testing, model fingerprinting, RAG security
▸ Detection engineering — Elastic (KQL) mapped to MITRE ATLAS
▸ Ongoing — Hack The Box Academy (Junior Cybersecurity Analyst) · Cisco Ethical Hacker (Dec 2026)`,

  'contact.txt':
`email     ngwenyambongeni04@gmail.com
github    github.com/franklynmbongeni
linkedin  linkedin.com/in/mbongenifranklyn-ngwenya
location  Warsaw, Poland`,

  'cv.pdf':'__BINARY__'
};
const LINKS={
  github:'https://github.com/franklynmbongeni',
  linkedin:'https://www.linkedin.com/in/mbongenifranklyn-ngwenya-b71335298',
  cv:'cv.pdf', email:'mailto:ngwenyambongeni04@gmail.com'
};

/* ---------- state ---------- */
const history=[]; let hi=0;
const startTime=Date.now();

/* ---------- helpers ---------- */
function printFile(name){
  const f=FS[name];
  if(f===undefined){line('<span class="red">cat: '+esc(name)+': No such file or directory</span>');return;}
  if(f==='__BINARY__'){line('<span class="dim">cat: '+esc(name)+': binary file — opening instead…</span>');window.open('cv.pdf','_blank');return;}
  f.split('\n').forEach(l=>{
    // light syntax coloring
    let h=esc(l);
    if(l.startsWith('#'))h='<span class="amber">'+h+'</span>';
    else if(l.startsWith('[')||l.startsWith('▸'))h='<span class="accent">'+h+'</span>';
    else h='<span class="dim">'+h+'</span>';
    line(h);
  });
}
function linkify(url,label){return '<a href="'+url+'" target="_blank" rel="noopener">'+esc(label||url)+'</a>';}

/* ---------- commands ---------- */
const CMD={
  help(){
    line('<span class="accent">Commands</span> <span class="dim">— this is a (simulated) shell. Try tab-free typing:</span>');
    const rows=[
      ['ls','list files in this directory'],
      ['cat &lt;file&gt;','print a file (e.g. cat projects.md)'],
      ['pwd','print working directory'],
      ['cd &lt;dir&gt;','change directory (try: cd projects)'],
      ['tree','show the directory tree'],
      ['whoami','one-line bio'],
      ['neofetch','system + profile summary'],
      ['open &lt;github|linkedin|cv&gt;','open a link'],
      ['uname -a','system info'],
      ['date','current date/time'],
      ['echo &lt;text&gt;','print text'],
      ['history','command history'],
      ['man &lt;cmd&gt;','manual for a command'],
      ['clear','clear the screen'],
      ['exit','return to the main site'],
    ];
    const g=document.createElement('div');g.className='ln tbl';
    rows.forEach(([k,v])=>{g.innerHTML+='<span class="k">'+k+'</span><span class="dim">'+v+'</span>';});
    out.appendChild(g);screen.scrollTop=screen.scrollHeight;
    line('<span class="dim">shortcuts: ↑/↓ history · click anywhere to focus · aliases: projects, skills, security, contact</span>');
  },
  ls(args){
    const long=args.includes('-l')||args.includes('-la')||args.includes('-al');
    const names=Object.keys(FS);
    if(long){
      names.forEach(n=>{
        const bin=FS[n]==='__BINARY__';
        const size=bin?'103K':(FS[n].length+'');
        line('<span class="dim">-rw-r--r--  1 mfn  staff  '+size.padStart(5)+'  </span><span class="'+(bin?'amber':'f')+'">'+n+'</span>');
      });
    } else {
      const g=document.createElement('div');g.className='ln cols';
      names.forEach(n=>{g.innerHTML+='<span class="'+(FS[n]==='__BINARY__'?'amber':'f')+'">'+n+'</span>';});
      out.appendChild(g);screen.scrollTop=screen.scrollHeight;
    }
  },
  cat(args){ if(!args[0]){line('<span class="red">cat: missing file operand</span>');return;} args.forEach(printFile); },
  pwd(){line('<span class="dim">/home/mfn</span>');},
  cd(args){
    const d=(args[0]||'~').replace(/\/$/,'');
    if(!d||d==='~'||d==='/home/mfn'){line('<span class="dim"># already home</span>');return;}
    const known=['projects','skills','security','about','contact'];
    if(known.includes(d)){
      line('<span class="dim"># this is a flat portfolio — showing '+esc(d)+' instead:</span>');
      (CMD[d]||(()=>printFile(d+(d==='projects'||d==='security'?'.md':'.txt'))))();
    } else line('<span class="red">cd: no such file or directory: '+esc(d)+'</span>');
  },
  tree(){
    [['.',''],
     ['about.txt','├─ '],['projects.md','├─ '],['skills.txt','├─ '],
     ['security.md','├─ '],['contact.txt','├─ '],['cv.pdf','└─ ']].forEach(([n,p],i)=>{
      const cls=i===0?'accent2':(n==='cv.pdf'?'amber':'f');
      line('<span class="dim">'+p+'</span><span class="'+cls+'">'+n+'</span>');
    });
    line('<span class="dim">\n0 directories, 6 files</span>');
  },
  whoami(){line('<span class="dim">Mbongeni Franklyn Ngwenya — CS + Cybersecurity student, Warsaw. Builds secure-by-design software.</span>');},
  neofetch(){
    const up=Math.max(1,Math.round((Date.now()-startTime)/1000));
    const art=[
"        _____        ","      / mfn \\       ","     |  ~_~  |      ","     |  \\_/  |      ","      \\_____/       "];
    const info=[
      ['user','mbongeni franklyn ngwenya'],
      ['role','CS · Cybersecurity student'],
      ['host','Vistula University, Warsaw'],
      ['shell','portfolio-zsh 1.0'],
      ['stack','Python · C++ · Bash · JS'],
      ['focus','secure coding · OWASP · detection'],
      ['uptime',up+'s'],
      ['contact','ngwenyambongeni04@gmail.com']
    ];
    const g=document.createElement('div');g.className='ln';
    let h='<div style="display:flex;gap:22px">';
    h+='<pre class="accent" style="margin:0">'+art.join('\n')+'</pre>';
    h+='<div>';
    info.forEach(([k,v])=>h+='<div><span class="accent2">'+k+'</span><span class="dim"> : '+esc(v)+'</span></div>');
    h+='</div></div>';
    g.innerHTML=h;out.appendChild(g);screen.scrollTop=screen.scrollHeight;
  },
  open(args){
    const k=(args[0]||'').toLowerCase();
    if(LINKS[k]){line('<span class="dim">opening '+k+' …</span>');window.open(LINKS[k],'_blank');}
    else line('<span class="red">open: unknown target — try: open github | linkedin | cv | email</span>');
  },
  uname(args){
    if(args.includes('-a')) line('<span class="dim">PortfolioOS mfn 1.0.0 secure x86_64 — built from scratch</span>');
    else line('<span class="dim">PortfolioOS</span>');
  },
  date(){line('<span class="dim">'+new Date().toString()+'</span>');},
  echo(args){line('<span class="dim">'+esc(args.join(' '))+'</span>');},
  history(){history.forEach((c,i)=>line('<span class="dim">'+String(i+1).padStart(3)+'  '+esc(c)+'</span>'));},
  man(args){
    const m={
      ls:'ls — list portfolio files. use -l for details.',
      cat:'cat FILE — print a file. try: cat about.txt, cat projects.md',
      cd:'cd DIR — change directory (flat site; shows the section).',
      neofetch:'neofetch — pretty system + profile summary.',
      open:'open TARGET — open github | linkedin | cv | email.'
    };
    const c=(args[0]||'').toLowerCase();
    if(m[c])line('<span class="dim">'+esc(m[c])+'</span>');
    else if(!c)line('<span class="red">What manual page do you want? (e.g. man ls)</span>');
    else line('<span class="red">No manual entry for '+esc(c)+'</span>');
  },
  clear(){out.innerHTML='';},
  sudo(){line('<span class="amber">nice try :)</span> <span class="dim">— mfn is not in the sudoers file. This incident will be reported.</span>');},
  /* friendly aliases */
  projects(){printFile('projects.md');},
  skills(){printFile('skills.txt');},
  security(){printFile('security.md');},
  about(){printFile('about.txt');},
  contact(){
    line('<span class="dim">email     </span>'+linkify(LINKS.email,'ngwenyambongeni04@gmail.com'));
    line('<span class="dim">github    </span>'+linkify(LINKS.github,'github.com/franklynmbongeni'));
    line('<span class="dim">linkedin  </span>'+linkify(LINKS.linkedin,'linkedin.com/in/mbongenifranklyn-ngwenya'));
    line('<span class="dim">location  </span>Warsaw, Poland');
  },
  cv(){CMD.open(['cv']);},
  github(){CMD.open(['github']);},
  linkedin(){CMD.open(['linkedin']);},
  exit(){line('<span class="dim">returning to main site …</span>');setTimeout(()=>location.href='index.html',500);},
  home(){CMD.exit();}
};

function run(raw){
  const cmdline=raw.trim();
  line('<span class="prompt"><span class="u">mfn@portfolio</span><span class="dim">:</span><span class="p">~</span><span class="dim">$</span></span> '+esc(cmdline));
  if(!cmdline)return;
  history.push(cmdline);hi=history.length;
  const parts=cmdline.split(/\s+/);
  const key=parts[0].toLowerCase();
  const args=parts.slice(1);
  if(CMD[key])CMD[key](args);
  else line('<span class="red">zsh: command not found: '+esc(key)+'</span> <span class="dim">— type </span><span class="accent">help</span>');
}

input.addEventListener('keydown',e=>{
  if(e.key==='Enter'){run(input.value);input.value='';}
  else if(e.key==='ArrowUp'){if(hi>0){hi--;input.value=history[hi]||'';}e.preventDefault();}
  else if(e.key==='ArrowDown'){if(hi<history.length){hi++;input.value=history[hi]||'';}e.preventDefault();}
  else if(e.key==='l'&&e.ctrlKey){CMD.clear();e.preventDefault();}
});
screen.addEventListener('click',()=>input.focus());

/* ---------- boot ---------- */
const boot=[
  ['<span class="dim">[  0.000] portfolio kernel booting…</span>',200],
  ['<span class="dim">[  0.214] mounting /home/mfn … </span><span class="accent">ok</span>',260],
  ['<span class="dim">[  0.502] starting secure session … </span><span class="accent">ok</span>',260],
  ['',120],
  ['<span class="amber">Mbongeni Franklyn Ngwenya</span>',100],
  ['<span class="dim">Computer Science · Cybersecurity · Warsaw, Poland</span>',100],
  ['',100],
  ['<span class="dim">Type </span><span class="accent">help</span><span class="dim"> for commands · </span><span class="accent">ls</span><span class="dim"> to list files · </span><span class="accent">neofetch</span><span class="dim"> for the overview.</span>',80],
  ['',60]
];
let bi=0;
(function runBoot(){
  if(bi>=boot.length){inputline.style.display='flex';input.focus();return;}
  const [html,delay]=boot[bi++];line(html);setTimeout(runBoot,delay);
})();
</script>
</body>
</html>
